<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Conquest">
<meta name="theme-color" content="#0c1a24"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Endless Conquest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito+Sans:wght@600;800;900&display=swap">
<style>
/* Layout: full-screen 3D canvas; HUD in corners like a mobile strategy game; steel-blue panels with gold trim and red ribbons */
:root{--ink:#f3f8ff;--panel:#24577a;--panel2:#173a54;--edge:#8cc8ea;--gold:#ffd25e;--gold2:#c98b12;--red:#c8382a;--good:#46d17c;--dim:#a9c4d8;--bg:#0c1a24;
--disp:"Cinzel",Georgia,serif;--body:"Nunito Sans",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#app{position:fixed;left:0;top:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none}.hud *{pointer-events:auto}
#tl{top:calc(env(safe-area-inset-top,0px) + 6px);left:6px;display:flex;gap:6px;align-items:flex-start}
.ava{width:62px;height:62px;border-radius:8px;background:radial-gradient(circle at 50% 35%,#7a4bb0,#241238);border:3px solid var(--gold);box-shadow:0 0 0 2px #5a3a00,0 4px 10px #000a;display:grid;place-items:center;font:900 26px var(--disp);color:var(--gold);position:relative;cursor:pointer}
.ava b{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:linear-gradient(#3f6f95,#1d3d57);border:2px solid var(--gold);border-radius:9px;font:900 12px var(--body);padding:0 7px;color:#fff}
.stat{display:flex;flex-direction:column;gap:3px}
.pill{display:flex;align-items:center;gap:6px;background:linear-gradient(#3b4e63,#1a2633 55%,#121b25);border:2px solid #c9a24a;box-shadow:inset 0 1px 0 #ffffff33,0 2px 3px #000a;border-radius:4px 12px 12px 4px;padding:1px 12px 1px 2px;min-width:96px;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 1px #000}
.ic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1}
.ic.gem{background:radial-gradient(circle at 35% 30%,#f2c6ff,#9b3fe0 55%,#4a1580);box-shadow:0 0 6px #b45cff}
.ic.pow{background:radial-gradient(circle at 35% 30%,#ffe7a0,#d48a10 60%,#6b3e00)}
.ic.sta{background:radial-gradient(circle at 35% 30%,#fff3a0,#f0b400 60%,#7a5200)}
.ic.food{background:radial-gradient(circle at 35% 30%,#fff1a8,#e3b23c 60%,#7a5a10)}
.ic.stone{background:radial-gradient(circle at 35% 30%,#f1f1f1,#9a9a9a 60%,#4a4a4a)}
.ic.wood{background:radial-gradient(circle at 35% 30%,#f0c890,#a5652a 60%,#4e2a0c)}
.ic.ore{background:radial-gradient(circle at 35% 30%,#d6e6ff,#5d7aa8 60%,#1f2f4a)}
.ic.gold{background:radial-gradient(circle at 35% 30%,#fff7c2,#f5c000 55%,#8a5a00);box-shadow:0 0 5px #ffd25e}
.ic.shd{background:radial-gradient(circle at 35% 30%,#d0f4ff,#3aa7d8 60%,#0d4766)}
.ic2{display:inline-block;flex:none;line-height:0;filter:drop-shadow(0 1px 1px #000a)}
.round .ic2{width:34px!important;height:34px!important}
.plus{margin-left:2px;width:17px;height:17px;border-radius:4px;background:linear-gradient(#e25446,#9b2318);border:1px solid #ffb3a8;color:#fff;font:900 13px/15px var(--body);text-align:center}
#tr{top:calc(env(safe-area-inset-top,0px) + 6px);right:6px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
#tick{top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);width:min(44vw,520px);background:rgba(0,0,0,.45);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:800;line-height:1.35;overflow:hidden;height:34px}
#tick span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bot{left:0;right:0;bottom:0;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;justify-content:center;align-items:flex-end}
.btn{font:900 13px var(--body);color:#fff;background:linear-gradient(#3d86b3,#1d5174);border:2px solid var(--edge);border-radius:11px;padding:8px 13px;cursor:pointer;box-shadow:0 3px 0 #0b2433,inset 0 1px 0 #ffffff55;text-shadow:0 1px 1px #000}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b2433}
.btn.gold{background:linear-gradient(#ffe08a,#e0a21f 55%,#b87808);border-color:#fff0b8;color:#3b2200;text-shadow:none;box-shadow:0 3px 0 #6b4a00,inset 0 1px 0 #fff8}
.btn.red{background:linear-gradient(#e2594a,#a32a1d);border-color:#ffb3a8}
.btn.big{font-size:15px;padding:10px 18px}
.btn:disabled{filter:grayscale(1) brightness(.6)}
.round{width:52px;height:52px;border-radius:14px;padding:0;font-size:24px;display:grid;place-items:center;position:relative}
.round small{position:absolute;bottom:-14px;font:900 10px var(--body);white-space:nowrap}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#e0322a;border:1.5px solid #fff;font:900 10px/15px var(--body);text-align:center;padding:0 3px}
#queue{left:6px;top:calc(env(safe-area-inset-top,0px) + 196px);display:flex;flex-direction:column;gap:5px}
.q{background:rgba(8,20,30,.88);border:1.5px solid var(--edge);border-radius:9px;padding:4px 7px;font-size:12px;font-weight:900;display:flex;gap:7px;align-items:center;min-width:180px}
.q .bar{flex:1;height:8px;background:#061018;border-radius:4px;overflow:hidden;border:1px solid #2c5470}.q .bar i{display:block;height:100%;background:linear-gradient(#7af2a8,#25a457)}
.q button{font:900 11px var(--body);padding:2px 7px;border-radius:7px;border:1px solid #fff0b8;background:linear-gradient(#ffe08a,#c98b12);color:#3b2200}
#warn{max-width:300px;font-size:11px!important;padding:3px 8px!important;left:50%;top:calc(env(safe-area-inset-top,0px) + 46px);transform:translateX(-50%);background:linear-gradient(#b3261b,#6d120b);border:2px solid #ff9a8a;border-radius:10px;padding:6px 12px;font-weight:900;font-size:13px;display:flex;gap:8px;align-items:center;animation:pulse 1s infinite alternate;box-shadow:0 0 18px #ff2a1a}
@keyframes pulse{to{box-shadow:0 0 4px #ff2a1a}}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);font:900 11px var(--body);text-align:center;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 3px #000}
.lb .lv{display:inline-grid;place-items:center;min-width:17px;height:14px;padding:0 3px;background:linear-gradient(#2f5e8e,#173556);border:1px solid #9fc8ea;border-radius:2px;margin-top:2px;font:800 10px var(--body);color:#fff;text-shadow:none;box-shadow:0 1px 2px #0009}
.lb .lv i{font-style:normal}
.lb .tm{display:block;background:rgba(0,0,0,.65);border:1px solid var(--gold);border-radius:6px;padding:1px 6px;color:var(--gold);margin-bottom:2px}
.lb.big{font-size:13px}
#ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.pan{width:min(580px,100%);max-height:86vh;overflow:auto;background:linear-gradient(var(--panel),var(--panel2));border:3px solid #4c8fba;outline:2px solid #0d2536;border-radius:14px;box-shadow:0 12px 40px #000,inset 0 0 0 2px #ffffff22;position:relative}
.rib{background:linear-gradient(#e2594a,#a32a1d 60%,#7a1a10);margin:-3px 44px 0;padding:8px;text-align:center;font:900 21px var(--disp);color:#fff3cf;border-radius:0 0 14px 14px;text-shadow:0 2px 0 #4d0f08;border:2px solid #ffb3a8;border-top:0}
.x{position:absolute;top:6px;right:8px;width:34px;height:34px;transform:rotate(45deg);border-radius:6px;border:2px solid #ffb3a8;background:linear-gradient(#e2594a,#a32a1d);color:var(--gold);font:900 18px var(--body)}
.x span{display:block;transform:rotate(-45deg)}
.pb{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cost{display:flex;gap:10px;flex-wrap:wrap;font-weight:900;font-size:13px}
.cost span{display:flex;align-items:center;gap:4px}.cost .no{color:#ff8a7a}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tc{background:linear-gradient(#c9a35a,#8a6a2c);border:2px solid #3a2a10;border-radius:8px;padding:6px 4px;text-align:center;cursor:pointer;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 1px #000;min-width:0}
.tc.on{outline:3px solid var(--gold);box-shadow:0 0 12px var(--gold)}.tc.lock{filter:grayscale(1) brightness(.6)}
.tc .ti{font-size:28px;line-height:1.2}.tc .n{background:#0009;border-radius:6px;margin-top:3px;padding:1px}
input[type=range]{width:100%;accent-color:var(--gold)}
.muted{color:var(--dim);font-size:12px}
.hp{height:12px;background:#300;border:1px solid #f99;border-radius:6px;overflow:hidden}.hp i{display:block;height:100%;background:linear-gradient(#ff8a7a,#c62c1e)}
.rep{background:#0d2536;border:1px solid #2f6a90;border-radius:9px;padding:8px 10px;font-size:13px}
.rep b.w{color:var(--good)}.rep b.l{color:#ff7a6a}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 4px;text-align:right}td:first-child,th:first-child{text-align:left}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);border:1.5px solid var(--gold);padding:8px 16px;border-radius:10px;font-weight:900;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#load{position:fixed;inset:0;display:grid;place-items:center;font:900 24px var(--disp);color:var(--gold);z-index:40;background:radial-gradient(#1c3a52,#08121a)}
#mini{width:100%;aspect-ratio:1;max-width:100%;background:#0a1a24;border-radius:10px;border:2px solid #4c8fba}

#bot{justify-content:flex-end!important;padding-right:96px!important;gap:6px!important}
#bMode{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:78px!important;height:78px!important;border-radius:16px!important}
#bMode .ic2{width:46px!important;height:46px!important}
#qbar{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:flex;align-items:center;gap:0;border-radius:10px;overflow:hidden;border:2px solid #79b6d8;cursor:pointer;max-width:min(560px,70vw)}
#qbar b{background:linear-gradient(#3d86b3,#1d5174);padding:5px 12px;font:900 14px var(--body)}
#qbar span{background:rgba(6,16,24,.86);padding:5px 12px;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#qbar.done span{color:#7af2a8}
#evrow{top:calc(env(safe-area-inset-top,0px) + 44px);left:50%;transform:translateX(-50%);display:flex;gap:10px}
.ev{width:46px;height:46px;position:relative;cursor:pointer;display:grid;place-items:center;filter:drop-shadow(0 2px 2px #000)}
.ev small{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font:900 11px var(--body);white-space:nowrap;text-shadow:0 1px 2px #000,0 0 3px #000}
.ev .dot{top:-3px;right:-3px}
#coord{top:calc(env(safe-area-inset-top,0px) + 44px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(6,16,24,.7);border:1.5px solid #79b6d8;border-radius:10px;padding:3px 12px;font-weight:900;font-size:15px;cursor:pointer}
#radial{position:fixed;z-index:6;pointer-events:none;left:0;top:0}
#radial .rb{position:absolute;pointer-events:auto;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 30%,#4a9fd0,#123d5a);border:2.5px solid #ffd25e;box-shadow:0 3px 8px #000a;display:grid;place-items:center;cursor:pointer;animation:pop .18s ease-out}
#radial .rb small{position:absolute;bottom:-15px;font:900 11px var(--body);white-space:nowrap;text-shadow:0 1px 2px #000,0 0 3px #000}
#radial .rb .ic2{width:30px!important;height:30px!important}
#radial .rt{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:rgba(6,16,24,.85);border:1.5px solid #ffd25e;border-radius:8px;padding:3px 10px;font-weight:900;font-size:13px;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){#radial .rb{animation:none}}
.inp{font:900 16px var(--body);width:90px;padding:6px 8px;border-radius:8px;border:2px solid #79b6d8;background:#0d2536;color:#fff}
#chat{left:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:min(300px,30vw);background:rgba(6,16,24,.72);border:1.5px solid #4c8fba;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:800;line-height:1.35;cursor:pointer;max-height:44px;overflow:hidden}
#chat div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#load{flex-direction:column;gap:14px;background:radial-gradient(ellipse at 50% 40%,#2c5a82,#0a1622 70%)!important}
#load .lt{font:900 clamp(30px,6vw,56px) var(--disp);color:var(--gold);text-shadow:0 3px 0 #6b4a00,0 0 30px #ffb00055;letter-spacing:.04em}
#load .lb2{width:min(420px,70vw);height:14px;border:2px solid var(--gold);border-radius:8px;background:#061018;overflow:hidden}#load .lb2 i{display:block;height:100%;width:0;background:linear-gradient(#7af2a8,#25a457);transition:width .2s}
#load .tip{font:800 13px var(--body);color:#cfe3f2;max-width:80vw;text-align:center}
#login{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(44,90,130,.82),rgba(6,12,20,.95));padding:16px;overflow:auto}
.lg-in{text-align:center;width:min(420px,100%)}.lg-title{font:900 clamp(28px,6vw,52px) var(--disp);color:var(--gold);text-shadow:0 3px 0 #6b4a00;margin-bottom:12px}
.lg-card{background:linear-gradient(var(--panel),var(--panel2));border:3px solid #4c8fba;border-radius:14px;padding:16px;box-shadow:0 12px 40px #000}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

/* ---- Lords-style screen template ---- */
#gcp,#enp,#vipp,#shp{display:none!important}
#tl{gap:4px!important}
.ava{width:78px!important;height:78px!important;border-radius:10px!important}
.ava b{left:-4px!important;bottom:-6px!important;transform:none!important;font-size:14px!important;padding:1px 9px!important;border-radius:4px 12px 12px 4px!important}
#tl .stat{gap:4px!important}
#tl .pill{min-width:150px;font-size:16px;padding:2px 14px 2px 2px;border-width:2px;background:linear-gradient(#4a3a26,#2a1f14 60%,#1c140c);border-color:#d9b25a}
#pwp{min-width:210px!important;font-size:18px!important}
#gmp .plus{width:26px;height:22px;font-size:18px;line-height:20px;margin-left:auto}
#tr{flex-direction:row!important}
#tr .pill{font-size:16px;min-width:110px;justify-content:flex-end;cursor:pointer}
#tick{top:calc(env(safe-area-inset-top,0px) + 4px)!important;left:280px!important;transform:none!important;width:calc(100vw - 460px)!important;max-width:720px;cursor:pointer;padding-left:34px!important}
#tick:before{content:"💬";position:absolute;left:6px;top:6px;font-size:18px}
#chat{display:none!important}
#evrow{top:calc(env(safe-area-inset-top,0px) + 46px)!important;left:280px!important;transform:none!important}
#rcol{right:8px;top:calc(env(safe-area-inset-top,0px) + 60px);display:flex;flex-direction:column;gap:16px;align-items:center}
#lcol{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;flex-direction:column;gap:10px}
#lcol .btn,#home{width:52px;height:52px;padding:0;border-radius:12px;display:grid;place-items:center}
#home{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:82px!important;height:72px!important;z-index:6}
#home .ic2{width:56px!important;height:56px!important}
#queue{top:calc(env(safe-area-inset-top,0px) + 120px)!important;left:96px!important}
.lvh{display:inline-grid;place-items:center;min-width:17px;height:14px;padding:0 3px;background:linear-gradient(#2f5e8e,#173556);border:1px solid #9fc8ea;border-radius:2px;font:800 10px var(--body);color:#fff;text-shadow:none;box-shadow:0 1px 2px #0009}

/* ---- fit iPhone screens (Dynamic Island / rounded corners in landscape) ---- */
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
#tl{left:calc(var(--sl) + 6px)!important}
#tr{right:calc(var(--sr) + 6px)!important}
#rcol{right:calc(var(--sr) + 8px)!important}
#lcol{left:calc(var(--sl) + 10px)!important}
#home{left:calc(var(--sl) + 8px)!important}
#queue{left:calc(var(--sl) + 96px)!important}
#tick{left:calc(var(--sl) + 280px)!important;width:calc(100vw - 470px - var(--sl) - var(--sr))!important}
#evrow{left:calc(var(--sl) + 280px)!important}
#bot{padding-right:calc(var(--sr) + 96px)!important;padding-left:calc(var(--sl) + 100px)!important}
#bMode{right:calc(var(--sr) + 8px)!important}
#login{padding:calc(var(--st) + 6px) calc(var(--sr) + 12px) calc(var(--sb) + 6px) calc(var(--sl) + 12px)!important;align-items:center}
.lg-in{width:min(460px,100%)!important}
.lg-title{font-size:clamp(22px,7vh,46px)!important;margin:0 0 6px!important;line-height:1.05}
.lg-card{padding:10px 14px!important}
.lg-card .ic2{width:40px!important;height:40px!important}
.lg-card .btn.big{padding:8px 14px!important;margin-top:8px!important}
#lnm{padding:7px!important;font-size:15px!important}
#load .lt{font-size:clamp(24px,8vh,52px)!important}
.pan{max-height:calc(100vh - 24px - var(--st) - var(--sb))!important}
#ov{padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) calc(var(--sb) + 8px) calc(var(--sl) + 12px)!important}
@media (max-height:460px){.ava{width:66px!important;height:66px!important}#tl .pill{font-size:14px!important;min-width:130px}#pwp{min-width:180px!important;font-size:16px!important}.round{width:48px!important;height:48px!important}.round .ic2{width:30px!important;height:30px!important}#bMode{width:70px!important;height:70px!important}#home{width:72px!important;height:64px!important}#rcol{gap:12px!important}#rcol .ev{width:40px;height:40px}#evrow .ev{width:40px;height:40px}#queue{top:calc(var(--st) + 106px)!important;left:calc(var(--sl) + 84px)!important}}
/* painted buttons: the picture already has its own frame */
.round.pic,#home.pic,#lcol .btn{background:none!important;border:none!important;box-shadow:none!important;padding:0!important}
.round.pic .ic2,#home.pic .ic2{width:100%!important;height:100%!important}
#bMode.pic{width:76px!important;height:76px!important}
#lcol .btn .ic2{width:48px!important;height:48px!important}
.bubw{pointer-events:auto}
.bub{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffffee,#d8ecffcc 45%,#7fb4e0aa);border:2px solid #fff;box-shadow:0 3px 8px #0008;cursor:pointer;animation:bubb 1.4s ease-in-out infinite}
@keyframes bubb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}
#brc{position:fixed;right:calc(var(--sr,0px) + 96px);bottom:calc(var(--sb,0px) + 92px);display:flex;gap:18px;align-items:flex-end;z-index:5}
#brc .ev{width:56px;height:56px}
#ccol{position:fixed;left:calc(var(--sl,0px) + 10px);bottom:calc(var(--sb,0px) + 14px);display:flex;flex-direction:column;gap:10px;z-index:5}
#ccol .btn{width:58px;height:58px;padding:0;background:none!important;border:none!important;box-shadow:none!important}

const WFX=[],FXT=[];let fxid=1;
function wfx(x,z,kind,txt){if(kind==="boom")sfx("boom");if(mode!=="world")return;for(let i=0;i<(kind==="boom"?7:4);i++){const s=spr(kind==="boom"?(i%2?0xff7a1a:0xffd23f):0xff3a2a,true,.95);s.position.set(x+rr(-1,1),rr(.6,2.2),z+rr(-1,1));s.scale.set(.4,.4,1);world.add(s);WFX.push({s,t:-i*.06,mx:rr(2.5,4.5)})}

 if(txt)FXT.push({id:fxid++,x,z,t:0,txt,col:kind==="boom"?"#ffd25e":"#ff7a6a"})}
function fxTick(dt){for(const f of WFX.slice()){f.t+=dt;if(f.t<0){f.s.visible=false;continue}f.s.visible=true;const k=f.smoke?1+f.t*2:.4+f.t*f.mx*2;f.s.scale.set(k,k,1);if(f.smoke)f.s.position.y+=dt*1.2;f.s.material.opacity=Math.max(0,(f.smoke?.5:.95)-f.t*(f.smoke?.35:1.6));if(f.t>1.5){world.remove(f.s);WFX.splice(WFX.indexOf(f),1)}}
 for(const f of FXT.slice()){f.t+=dt;if(f.t>1.8)FXT.splice(FXT.indexOf(f),1)}}
